name: Release

# Push a tag like v0.1.2 -> tests run -> GitHub release is created (HACS installs releases).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match manifest version
        run: |
          manifest=$(jq -r .version custom_components/nixie_clock/manifest.json)
          if [ "v${manifest}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match manifest version ${manifest}"
            exit 1
          fi

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv pip install --system -r requirements_test.txt
      - run: ruff check . && pytest -q

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes --verify-tag
